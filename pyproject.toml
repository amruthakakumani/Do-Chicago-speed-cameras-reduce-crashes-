[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago-cameras"
version = "0.2.0"
description = "Reproducible causal-inference study of Chicago speed cameras and crashes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Original study authors (see README acknowledgements)" },
  { name = "Research upgrade contributors" },
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "pyarrow>=14",
  "pyproj>=3.6",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "nbformat>=5.9"]

[project.scripts]
chicago-cameras = "chicago_cameras.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
