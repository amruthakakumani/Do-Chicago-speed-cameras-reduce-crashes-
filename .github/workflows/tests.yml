name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # CI intentionally installs only the analysis + dev extras; it does not
          # download the Chicago crash dataset and never calls the network.
          pip install -e ".[dev,ml]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify the package imports without data
        run: python -c "import chicago_cameras; print(chicago_cameras.__version__)"
